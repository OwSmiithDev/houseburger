<html lang="pt-BR">

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121212" />

    <title>House Burger — Peça pelo celular</title>
    <meta
      name="description"
      content="Monte seu pedido no House Burger e envie direto pelo WhatsApp. Hambúrgueres, combos, batatas e bebidas."
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="House Burger — Peça pelo celular" />

      property="og:description"

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
